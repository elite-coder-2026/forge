[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge"
version = "0.1.0"
description = "A local agentic coding CLI backed by Ollama"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "ollama>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
forge = "forge.main:main"

[tool.setuptools.packages.find]
include = ["forge*"]
