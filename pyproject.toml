[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge"
version = "0.1.0"
description = "A local agentic coding CLI backed by Ollama"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "ollama>=0.3.0",
    "prompt_toolkit>=3.0",
    "jinja2>=3.1",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyright",
    "mcp",  # a real server for the MCP integration test (skipped if absent)
]
lsp = [
    "pyright",
]
voice = [
    "faster-whisper",
]

[project.scripts]
forge = "forge.main:main"

[tool.setuptools.packages.find]
include = ["forge*"]

[tool.setuptools.package-data]
forge = ["templates/*.html"]
